name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

  # A tag created from the GitHub UI (the Tags page, or publishing a release)
  # does not always produce a `push` event, so listen for the `create` and
  # `release` events as well. `just publish` is idempotent, so overlapping runs
  # are safe.
  create:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. v0.1.8. Leave empty to only build and test.'
        required: false
        type: string

# `just` derives the release version from this value. A tag name ("v0.1.8")
# is used as-is; a branch name falls back to the tag on HEAD, then to the
# development version in package.json.template (0.0.0).
env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

# A tag can arrive through more than one of the events above. Serialize runs
# for the same ref so the publish steps never race; each run is idempotent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # `create` also fires for new branches; only tags can be release candidates.
    if: github.event_name != 'create' || github.event.ref_type == 'tag'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: 1.59.0

      # package.json is generated, so it must exist before `npm ci`.
      - name: Generate package.json
        run: just generate "$VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Lint, compile, and unit test
        run: just check

      # Run VS Code integration tests with xvfb on Linux
      - name: Run VS Code tests (Linux)
        run: xvfb-run -a just integration-test
        if: runner.os == 'Linux'

      - name: Run VS Code tests (non-Linux)
        run: just integration-test
        if: runner.os != 'Linux'

  # Package platform-specific extensions.
  # Each target must run on a runner that matches its architecture
  # so npm installs the correct native bindings.
  package:
    needs: build
    strategy:
      matrix:
        include:
          # macOS ARM64 (M1/M2) - macos-14+ are ARM64
          - os: macos-14
            target: darwin-arm64
          # macOS x64 (Intel) - macos-15-intel for x64 builds
          - os: macos-15-intel
            target: darwin-x64
          # Linux x64
          - os: ubuntu-latest
            target: linux-x64
          # Windows x64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: 1.59.0

      - name: Package extension for ${{ matrix.target }}
        run: just package "$VERSION" "${{ matrix.target }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: '*.vsix'

  # Publish every VSIX to the VS Code Marketplace, Open VSX, and a GitHub
  # Release. All of the logic lives in `just publish`; the steps here only
  # supply the artifacts, secrets, and permissions.
  publish:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: 1.59.0

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          merge-multiple: true

      - name: Publish
        run: just publish "$VERSION"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
